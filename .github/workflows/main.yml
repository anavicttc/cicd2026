name: Primer workflow

on: push

jobs:
  probar_software:
   runs-on: ubuntu-latest

   steps:
    - name: instalar pytest
      run: pip install pytest
    - name: Bajar código
      uses: actions/checkout@v7
    - name: Probar código
      run: python3 wallet.py
    - name: testear
      run: python3 test.py
